<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍔 BiteBot | Next-Gen Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS resets and variables */
        :root {
            --bg: #0f0f11;
            --surface: rgba(25, 25, 30, 0.6);
            --primary: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.4);
            --secondary: #ff7f50;
            --text: #f1f2f6;
            --text-muted: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 71, 87, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 127, 80, 0.15), transparent 25%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
        }

        .avatar {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .header-info h2 {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-info p {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
        }
        .header-info p::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ed573;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ed573;
        }

        /* Chat Area */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
            word-wrap: break-word;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-bottom-right-radius: 4px;
            color: white;
            box-shadow: 0 5px 15px var(--primary-glow);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            padding: 12px 18px;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            border-radius: 20px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px var(--primary-glow);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        
        button:active {
            transform: scale(0.95);
        }

        button svg {
            fill: white;
            width: 20px;
            height: 20px;
            margin-left: 2px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <div class="avatar">🌶️</div>
            <div class="header-info">
                <h2>BiteBot</h2>
                <p>Online & vibing</p>
            </div>
        </div>

        <div class="chat-box" id="chat">
            <div class="msg bot">Yo! Welcome to the spot. 🍔 What are you craving today? Ask me about breakfast, lunch, or dinner!</div>
            <div class="typing-indicator" id="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Spill the tea on the menu..." onkeypress="handleKeyPress(event)" autocomplete="off" />
            <button onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat');
        const typingIndicator = document.getElementById('typing');

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById("userInput");
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputEl.value = "";
            
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ input: text })
                });
                
                const data = await res.json();
                typingIndicator.style.display = 'none';
                
                if(data.output) {
                    appendMessage(data.output, 'bot');
                } else {
                    appendMessage("Oops, my brain froze. Try again? 🥶", 'bot');
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                appendMessage("Network error. The vibes are off! 📶", 'bot');
            }
        }
    </script>
</body>
</html>
